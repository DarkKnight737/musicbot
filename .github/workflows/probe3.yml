name: ytdlp-cookie-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp (latest)
        run: pip install -q -U yt-dlp

      - name: Download with cookies (the fix test)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > /tmp/cookies.txt
          python - <<'PY'
          import yt_dlp, time, pathlib, shutil
          d = pathlib.Path("dl_cookie_test")
          shutil.rmtree(d, ignore_errors=True)
          d.mkdir()
          opts = dict(quiet=True, no_warnings=True, noprogress=True,
                      socket_timeout=25, retries=1, noplaylist=True,
                      cookiefile="/tmp/cookies.txt",
                      format="bestaudio[ext=m4a][abr<=192]/bestaudio[ext=m4a]/bestaudio",
                      outtmpl=str(d / "source.%(ext)s"))
          t0 = time.time()
          try:
              with yt_dlp.YoutubeDL(opts) as ydl:
                  ydl.download(["https://www.youtube.com/watch?v=4qNRgzHTQsk"])
              f = next(d.iterdir())
              print(f"RESULT cookie-download: OK size={f.stat().st_size} t={time.time()-t0:.1f}s")
          except Exception as e:
              msg = str(e)
              i = msg.find("ERROR: ")
              tag = msg[i:i+150].replace("\n", " ") if i >= 0 else msg[:120].replace("\n", " ")
              print(f"RESULT cookie-download: FAIL t={time.time()-t0:.1f}s :: {tag}")
          finally:
              shutil.rmtree(d, ignore_errors=True)
          PY

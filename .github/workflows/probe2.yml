name: ytdlp-client-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp (latest)
        run: pip install -q -U yt-dlp

      - name: Try each player client on a real download
        run: |
          python - <<'PY'
          import yt_dlp, time, pathlib, shutil
          clients = ["tv_embedded", "web_embedded", "android_vr", "tv",
                     "mweb", "ios", "web_safari"]
          base = dict(quiet=True, no_warnings=True, noprogress=True,
                      socket_timeout=20, retries=0, noplaylist=True,
                      format="bestaudio[ext=m4a][abr<=192]/bestaudio[ext=m4a]/bestaudio",
                      concurrent_fragment_downloads=4)
          url = "https://www.youtube.com/watch?v=4qNRgzHTQsk"
          for c in clients:
              d = pathlib.Path(f"dl_{c}")
              if d.exists(): shutil.rmtree(d)
              d.mkdir()
              opts = {**base, "outtmpl": str(d / "source.%(ext)s"),
                      "extractor_args": {"youtube": {"player_client": [c]}}}
              t0 = time.time()
              try:
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      ydl.download([url])
                  f = next(d.iterdir())
                  print(f"RESULT {c}: OK size={f.stat().st_size} t={time.time()-t0:.1f}s")
              except Exception as e:
                  msg = str(e)
                  # first line of the actual error only
                  for marker in ("ERROR: [youtube]", "DownloadError"):
                      i = msg.find(marker)
                  i = msg.find("ERROR: ")
                  tag = msg[i:i+120].replace("\n", " ") if i >= 0 else msg[:100].replace("\n", " ")
                  print(f"RESULT {c}: FAIL t={time.time()-t0:.1f}s :: {tag}")
              finally:
                  shutil.rmtree(d, ignore_errors=True)
          IP = __import__("subprocess").run(["curl","-s","https://checkip.amazonaws.com"],
                                            capture_output=True, text=True).stdout.strip()
          print(f"egress IP: {IP}")
          PY

      - name: Fallback test — PO token provider (bgutil) if plain clients fail
        if: always()
        run: |
          node --version
          pip install -q -U bgutil-ytdlp-pot-provider
          npx --yes bgutil@1.0.0 --version 2>/dev/null || true
          # start token server in the background (npm package ships the server)
          npx --yes github:Brainicism/bgutil-ytdlp-pot-provider#master --http_port 4416 > pot_server.log 2>&1 &
          sleep 8
          python - <<'PY'
          import yt_dlp, time, pathlib, shutil
          d = pathlib.Path("dl_pot"); 
          if d.exists(): shutil.rmtree(d)
          d.mkdir()
          opts = dict(quiet=True, no_warnings=True, noprogress=True,
                      socket_timeout=25, retries=1, noplaylist=True,
                      format="bestaudio[ext=m4a][abr<=192]/bestaudio[ext=m4a]/bestaudio",
                      outtmpl=str(d / "source.%(ext)s"),
                      extractor_args={"youtube": {"player_client": ["web_safari", "web"]}})
          t0 = time.time()
          try:
              with yt_dlp.YoutubeDL(opts) as ydl:
                  ydl.download(["https://www.youtube.com/watch?v=4qNRgzHTQsk"])
              f = next(d.iterdir())
              print(f"RESULT pot-provider: OK size={f.stat().st_size} t={time.time()-t0:.1f}s")
          except Exception as e:
              msg = str(e)
              i = msg.find("ERROR: ")
              tag = msg[i:i+120].replace("\n"," ") if i >= 0 else msg[:100].replace("\n"," ")
              print(f"RESULT pot-provider: FAIL t={time.time()-t0:.1f}s :: {tag}")
          PY
          echo "--- pot server log head:"
          head -5 pot_server.log || true
